    <meta name="description" content="Plataforma digital e portal moderno para produtores familiares de Inhambane com autenticação biométrica, 2FA multifator, redes sociais, recuperação por e-mail, modo escuro e relatórios PDF." />

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('agro_theme');
          const isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100 transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
