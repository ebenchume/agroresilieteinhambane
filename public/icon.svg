<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded squircle for maskable/any compatibility -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="4" stroke-dasharray="12 8" />

  <!-- Golden Sun Crest behind sprout -->
  <circle cx="256" cy="180" r="76" fill="url(#sunGrad)" opacity="0.9" filter="url(#shadow)" />
  <circle cx="256" cy="180" r="92" fill="none" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="3" />

  <!-- Soil / Earth Hill -->
  <path d="M 96 384 Q 256 310 416 384 L 416 432 Q 256 410 96 432 Z" fill="#78350f" opacity="0.75" />
  <path d="M 128 392 Q 256 330 384 392 L 384 416 Q 256 390 128 416 Z" fill="#92400e" opacity="0.6" />

  <!-- Resilient Agricultural Sprout / Maize Plant -->
  <!-- Stem -->
  <path d="M 256 360 L 256 190" stroke="#a7f3d0" stroke-width="16" stroke-linecap="round" />

  <!-- Left Leaf -->
  <path d="M 256 290 C 200 280 150 220 140 160 C 180 180 230 220 256 250 Z" fill="url(#leafGrad)" filter="url(#shadow)" />
  <path d="M 256 250 C 190 230 160 170 140 160" stroke="#d1fae5" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Right Leaf -->
  <path d="M 256 260 C 312 250 362 190 372 130 C 332 150 282 190 256 220 Z" fill="url(#leafGrad)" filter="url(#shadow)" />
  <path d="M 256 220 C 322 200 352 140 372 130" stroke="#d1fae5" stroke-width="4" stroke-linecap="round" fill="none" />

  <!-- Top Sprout Bud -->
  <path d="M 256 190 C 242 160 248 120 256 100 C 264 120 270 160 256 190 Z" fill="#6ee7b7" />

  <!-- Drops of water / moisture (resilience) -->
  <circle cx="210" cy="140" r="7" fill="#67e8f9" opacity="0.8" />
  <circle cx="304" cy="115" r="9" fill="#67e8f9" opacity="0.9" />

  <!-- Badge text AgroResiliente -->
  <rect x="136" y="420" width="240" height="42" rx="21" fill="#022c22" stroke="#34d399" stroke-width="2" />
  <text x="256" y="446" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#f0fdf4" text-anchor="middle" letter-spacing="2">INHAMBANE</text>
</svg>
